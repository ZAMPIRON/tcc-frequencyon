{# cabecalho comum: fontes, boostrap, icones e design system e usa dentro de <head>. #}
<script>
    (function () {
        var t = "dark";
        try { t = localStorage.getItem("fo-tema") || "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-bs-theme", t);
        document.documentElement.classList.add("fo-js");
    })();
</script>
