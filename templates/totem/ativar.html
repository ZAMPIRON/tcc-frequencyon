<!DOCTYPE html>
<html lang="pt-BR" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ativar totem - FrequencyON</title>
    {% include 'componentes/cabecalho.html' %}
    <link href="{{ url_for('static', filename='css/totem.css') }}" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
</head>
<body class="totem d-flex align-items-center justify-content-center h-100 p-3">
    <div class="card ativar-card p-4 p-sm-5 text-center">
        <span class="fo-logo-icone tamanho-70 mx-auto mb-3"><i class="bi bi-person-bounding-box"></i></span>
        <h1 class="h3 fw-bold mb-1">Frequency<span class="fo-gradient-text">ON</span></h1>
        <p class="text-muted mb-4">Este aparelho ainda não está ativado como totem de presença.</p>

        {% if erro %}
        <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('reconhecimento.ativar_totem') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="codigo" class="form-label fw-bold small">Código de ativação</label>
            <input type="text" id="codigo" name="codigo" class="form-control form-control-lg text-center fw-bold codigo-input mb-3"
                   maxlength="9" placeholder="XXXX XXXX" autocomplete="off" autocapitalize="characters" required autofocus>
            <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-unlock me-1"></i> Ativar</button>
        </form>

        <p class="small text-muted mt-4 mb-0">
            O código é gerado pela coordenação em <strong>Painel &rarr; Totens</strong> e vale por 15 minutos.
        </p>
    </div>
</body>
</html>
