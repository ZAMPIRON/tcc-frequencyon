<!DOCTYPE html>
<html lang="pt-BR" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Liberar totem - FrequencyON</title>
    {% include 'componentes/cabecalho.html' %}
    <link href="{{ url_for('static', filename='css/totem.css') }}" rel="stylesheet">
    <script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
</head>
<body class="totem d-flex align-items-center justify-content-center h-100 p-3">
    <div class="card ativar-card p-4 p-sm-5 text-center">
        <span class="fo-logo-icone tamanho-70 mx-auto mb-3"><i class="bi bi-person-bounding-box"></i></span>
        <h1 class="h3 fw-bold mb-1">Frequency<span class="fo-gradient-text">ON</span></h1>
        <p class="text-muted mb-4">Totem bloqueado. Professor, entre com seu e-mail e senha para liberar a presença de hoje.</p>

        {% if erro %}
        <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('reconhecimento.liberar_totem') }}" class="text-start">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email" class="form-label fw-bold small">E-mail do professor</label>
            <input type="email" id="email" name="email" class="form-control form-control-lg mb-3" value="{{ email or '' }}"
                   placeholder="professor@escola.com" autocomplete="off" required autofocus>
            <label for="senha" class="form-label fw-bold small">Senha</label>
            <input type="password" id="senha" name="senha" class="form-control form-control-lg mb-3" autocomplete="off" required>
            <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-unlock me-1"></i> Liberar até o fim do dia</button>
        </form>

        <p class="small text-muted mt-4 mb-0">O totem volta a bloquear sozinho à meia-noite.</p>
    </div>
</body>
</html>
