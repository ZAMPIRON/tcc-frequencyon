<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FrequencyON</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS Customizado (Apenas o essencial) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0">
</head>

<body class="login-bg d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card login-card border-0 shadow-lg p-4 p-sm-5 rounded-4 w-100">
        <form action="/login/admin" method="POST">
            
            <!-- Cabeçalho -->
            <div class="text-center mb-4">
                <img src="assets/logo.png" alt="Logo FrequencyON" class="logo-img mb-2">
                <h1 class="h3 fw-bold text-dark m-0">Frequency<span class="text-primary">ON</span></h1>
                <p class="text-secondary small mb-0">Controle de frequência inteligente</p>
            </div>

            <!-- Email / Matrícula -->
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary small">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted fs-5">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="text" id="email" name="email" class="form-control border-start-0 py-2" placeholder="seuemail@gmail.com" required>
                </div>
            </div>

            <!-- Senha -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="senhaInput" class="form-label fw-semibold text-secondary small mb-0">Senha</label>
                    <a href="#" class="text-decoration-none text-primary small fw-semibold">Esqueci minha senha</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted fs-5">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="senhaInput" name="senha" class="form-control border-start-0 border-end-0 py-2" placeholder="••••••••••••" required>
                    <span class="input-group-text bg-white border-start-0 text-muted fs-5 cursor-pointer" id="toggleIcon">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <!-- Botão Entrar -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 fs-6">Entrar</button>

        </form>
    </div>

    <!-- Script para alternar visibilidade da senha -->
    <script>
        const senhaInput = document.getElementById('senhaInput');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleIcon.addEventListener('click', () => {
            const isPassword = senhaInput.type === 'password';
            senhaInput.type = isPassword ? 'text' : 'password';
            
            const icon = toggleIcon.querySelector('i');
            icon.classList.toggle('bi-eye', !isPassword);
            icon.classList.toggle('bi-eye-slash', isPassword);
        });
    </script>
</body>
</html>
