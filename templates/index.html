<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher Perfil - FrequencyON</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Fundo com degradê suave e fluído */
        body.login-bg {
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(147, 197, 253, 0.7) 0%, transparent 45%),
                radial-gradient(circle at 10% 80%, rgba(196, 181, 253, 0.7) 0%, transparent 45%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Cartão Central */
        .login-card {
            max-width: 400px;
            background-color: #f8fafc;
            border-radius: 24px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04) !important;
        }

        /* Ícone Biométrico */
        .bio-icon {
            font-size: 3.5rem;
            color: #3b82f6;
            line-height: 1;
        }

        /* Estilização dos Botões */
        .btn-aluno {
            background-color: #22c55e;
            color: #ffffff;
            border: none;
        }
        .btn-aluno:hover {
            background-color: #16a34a;
            color: #ffffff;
        }

        .btn-professor {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
        }
        .btn-professor:hover {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-admin {
            background-color: #475569;
            color: #ffffff;
            border: none;
        }
        .btn-admin:hover {
            background-color: #334155;
            color: #ffffff;
        }

        /* Transição suave ao passar o mouse */
        .btn {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>

<body class="login-bg d-flex align-items-center justify-content-center p-3">

    <div class="card login-card border-0 p-4 p-sm-5 w-100">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-4">
            <!-- Ícone de Reconhecimento Facial -->
            <div class="mb-3">
                <i class="bi bi-person-bounding-box bio-icon"></i>
            </div>
            
            <!-- Título e Subtítulo -->
            <h1 class="h3 fw-bold text-dark m-0">Frequency<span class="text-primary">ON</span></h1>
            <p class="text-secondary small mb-0 mt-1 fs-7">Controle de frequência inteligente</p>
        </div>

        <!-- Opções de Perfil -->
        <div class="d-grid gap-3">
            <a href="/login/aluno" class="btn btn-aluno py-2-5 py-2 fw-bold rounded-3">
                Entrar como Aluno
            </a>
            
            <a href="/login/professor" class="btn btn-professor py-2-5 py-2 fw-bold rounded-3">
                Entrar como Professor
            </a>
            
            <a href="/login/admin" class="btn btn-admin py-2-5 py-2 fw-bold rounded-3">
                Entrar como Administrador
            </a>
        </div>

    </div>

</body>
</html>
